server:
  port: 8080

spring:
  application:
    name: e-contract-evidence

  datasource:
    url: jdbc:postgresql://localhost:5432/example_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: localhost
    port: 6379
    password:
    timeout: 6000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# 区块链配置
blockchain:
  ethereum:
    rpc-url: http://localhost:8545
    contract-address: 0x1234567890abcdef1234567890abcdef12345678
    private-key: your-private-key
  fabric:
    channel-name: mychannel
    chaincode-name: evidence
    msp-id: Org1MSP
    connection-profile: fabric/connection-profile.json

# JWT配置
jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation
  expiration: 86400000

# 存证配置
evidence:
  storage-path: ./data/storage
  max-file-size: 10485760
  hash-algorithm: SHA-256

logging:
  level:
    com.example.contract: DEBUG
    org.hibernate.SQL: DEBUG